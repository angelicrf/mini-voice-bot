apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-ai
  labels:
    app: voice-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-ai
  template:
    metadata:
      labels:
        app: voice-ai
    spec:
      containers:
        - name: api
          image: mini-voice-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /voice
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /voice
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: voice-ai-service
  labels:
    app: voice-ai
spec:
  type: ClusterIP
  selector:
    app: voice-ai
  ports:
    - name: http
      port: 80
      targetPort: 8000
